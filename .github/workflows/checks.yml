name: Checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install -r backend/requirements-ci.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app backend/alembic backend/tools
      - run: DATABASE_URL=sqlite:////tmp/atlas-migration-ci.db alembic upgrade head
        working-directory: backend
      - run: DATABASE_URL=sqlite:////tmp/atlas-migration-ci.db alembic downgrade 0002_evidence_audit && DATABASE_URL=sqlite:////tmp/atlas-migration-ci.db alembic upgrade head
        working-directory: backend
      - run: DATABASE_URL=sqlite:////tmp/atlas-migration-ci.db alembic downgrade 0001_initial && DATABASE_URL=sqlite:////tmp/atlas-migration-ci.db alembic upgrade head
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.demo -t atlas-browser-demo .
      - name: Serve built UI and API
        run: |
          docker run -d --name atlas-browser-demo -p 10000:10000 -e APP_ENV=production -e EMBEDDING_PROVIDER=hash -e JWT_SECRET=ci-only-demo-secret-do-not-use-on-public-instances-123 atlas-browser-demo
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/api/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/api/health/ready
          curl -fsS http://127.0.0.1:10000/app/chat | grep -q "assets/"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/assets/missing.js)" = "404"
      - name: Verify live preview workflow
        run: |
          set -euo pipefail
          base=http://127.0.0.1:10000/api
          auth=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"preview-ci@example.com","password":"preview-ci-password-123"}' "$base/auth/register")
          token=$(printf '%s' "$auth" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          upload=$(curl -fsS -H "Authorization: Bearer $token" -F "file=@backend/benchmarks/fixture/incident.txt;type=text/plain" "$base/files/upload")
          file_id=$(printf '%s' "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for attempt in $(seq 1 30); do
            listing=$(curl -fsS -H "Authorization: Bearer $token" "$base/files/list")
            state=$(printf '%s' "$listing" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["status"])')
            if [ "$state" = ready ]; then break; fi
            if [ "$state" = failed ]; then echo 'Indexing failed' >&2; exit 1; fi
            sleep 2
          done
          test "$state" = ready
          hits=$(curl -fsSG -H "Authorization: Bearer $token" --data-urlencode 'q=cooling pump P-17' "$base/search")
          printf '%s' "$hits" | python3 -c 'import json,sys; assert any(hit["file_name"] == "incident.txt" for hit in json.load(sys.stdin))'
          answer=$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"question":"Which pump stopped?"}' "$base/chat/query")
          printf '%s' "$answer" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["citations"] and "P-17" in data["answer"]'
